name: Bienvenue Discord
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Mode test (1 = juste générer une image)'
        default: '0'
permissions:
  contents: write
concurrency: bienvenue
jobs:
  bienvenue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: etat
          path: etat-branche
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pillow requests
      - run: python outils/discord_bienvenue.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.test || '0' }}
          CC_WD: ${{ runner.temp }}/cc
          ETAT_FILE: etat-branche/etat/bienvenue.json
      - name: Sauvegarde (branche etat)
        working-directory: etat-branche
        run: |
          git config user.name "clash-center-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A etat
          git diff --cached --quiet || (git commit -m "Bienvenue : état" && git push -q origin HEAD:etat)
