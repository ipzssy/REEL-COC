name: Parametres serveur Discord
on:
  workflow_dispatch:
jobs:
  parametres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pillow requests
      - run: python outils/discord_parametres.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CC_WD: ${{ runner.temp }}/cc
