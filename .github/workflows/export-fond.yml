name: Export fond bienvenue
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fond:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: etat
          path: etat-branche
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pillow requests
      - run: python outils/fond_bienvenue_v3.py
        env:
          CC_WD: ${{ runner.temp }}/cc
          OUT: etat-branche/fond_bienvenue_v3_1100x500.jpg
      - working-directory: etat-branche
        run: |
          git config user.name "clash-center-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -m "Fond de bienvenue v3" && git push -q origin HEAD:etat
