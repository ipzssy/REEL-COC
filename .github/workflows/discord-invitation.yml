name: Lien d'invitation Discord
on:
  workflow_dispatch:
jobs:
  invitation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - run: python outils/discord_invitation.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
