<style>
/* Concept : écran-titre de jeu, nuit violette. Écusson d'argent, panneaux de pierre cerclés d'or,
   bulles magiques roses et lucioles qui flottent, silhouette de forêt éclairée par l'horizon. */
:root {
  --nuit-haut: #140a38;
  --nuit-milieu: #2a1673;
  --nuit-bas: #4b2a8f;
  --horizon: #e0763c;
  --or: #f4b83a;
  --or-clair: #ffe9a0;
  --or-fonce: #9a5c0a;
  --brun: #2b1608;
  --creme: #fff3cf;
  --pierre-haut: #5a5873;
  --pierre-bas: #383650;
  --pierre-creux: #2a2840;
  --rose: #ff4fd8;
  --violet-lueur: #b48cff;
  --display: 'Lilita One', 'Luckiest Guy', 'Arial Black', Impact, sans-serif;
  --texte: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--nuit-haut); }
body {
  margin: 0; min-height: 100vh; position: relative; overflow-x: hidden;
  padding-block: 34px 150px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(180deg, var(--nuit-haut) 0%, var(--nuit-milieu) 55%, var(--nuit-bas) 100%);
  background-color: var(--nuit-haut);
  color: var(--creme); font-family: var(--texte); font-weight: 700; font-size: 16px; line-height: 1.35;
}
/* décor fixe */
.decor { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.lueur { position: absolute; left: 50%; bottom: -12vh; width: 130vmax; height: 60vmax; margin-left: -65vmax; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 60%, rgba(255, 150, 90, .55), rgba(190, 80, 170, .3) 35%, transparent 68%); animation: respire 7s ease-in-out infinite; }
.orbe {
  position: absolute; border-radius: 50%; width: var(--t); height: var(--t); left: var(--x); top: var(--y);
  background: radial-gradient(circle at 34% 30%, #ffe0fb 0 8%, #ff7ee6 22%, #d225b4 58%, #7a0f78 100%);
  box-shadow: 0 0 calc(var(--t) * .7) rgba(255, 79, 216, .75), inset 0 -4px 8px rgba(80, 0, 80, .45);
  animation: flotte var(--d) ease-in-out infinite; animation-delay: var(--r);
}
.orbe::before { content: ""; position: absolute; left: 50%; top: -22%; width: 34%; height: 28%; transform: translateX(-50%); border-radius: 4px 4px 2px 2px; background: linear-gradient(#e8d9b0, #a08a58); }
canvas#lucioles { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.foret { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 150px; pointer-events: none; display: block; }

main { position: relative; z-index: 2; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

/* écusson */
.bouclier { position: relative; container-type: inline-size; width: min(78%, 300px); margin: 0 auto 0; aspect-ratio: 360 / 350; animation: titre .9s cubic-bezier(.2, 1.3, .4, 1) both; }
.bouclier > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; filter: drop-shadow(0 12px 18px rgba(0, 0, 0, .5)); }
.ruban {
  position: absolute; left: 50%; top: 3.2%; transform: translateX(-50%); z-index: 2; white-space: nowrap;
  padding: 1.8cqw 4.5cqw; border-radius: 3cqw; font-family: var(--display); font-size: 4.9cqw; letter-spacing: .05em; text-transform: uppercase; color: var(--or-clair);
  background: linear-gradient(#3b2a28, #231614); border: .9cqw solid var(--or); box-shadow: 0 1cqw 0 var(--or-fonce), 0 2cqw 3cqw rgba(0, 0, 0, .5), inset 0 0 0 .5cqw rgba(0, 0, 0, .5);
  text-shadow: 0 .4cqw 0 #000;
}
.nom-chaine { position: absolute; left: 0; right: 0; top: 22%; text-align: center; margin: 0; font-family: var(--display); font-weight: 400; text-transform: uppercase; line-height: .92; z-index: 1; }
.nom-chaine span { display: block; position: relative; font-size: 21.5cqw; color: var(--brun); -webkit-text-stroke: 3cqw var(--brun); filter: drop-shadow(0 1.6cqw 0 rgba(0, 0, 0, .55)); }
.nom-chaine span:last-child { font-size: 18.5cqw; margin-top: -.5cqw; }
.nom-chaine span::after {
  content: attr(data-t); position: absolute; left: 0; top: 0; width: 100%; -webkit-text-stroke: 0; color: transparent;
  background: linear-gradient(180deg, #fff6c4 0%, #ffd75a 38%, #f0a21c 62%, #ffcf4a 100%), linear-gradient(100deg, transparent 40%, #fff 50%, transparent 60%);
  -webkit-background-clip: text; background-clip: text;
}
.nom-chaine span::before { /* reflet qui passe sur les lettres */
  content: attr(data-t); position: absolute; left: 0; top: 0; width: 100%; z-index: 1; -webkit-text-stroke: 0; color: transparent;
  background: linear-gradient(100deg, transparent 42%, rgba(255, 255, 255, .95) 50%, transparent 58%) 160% 0 / 250% 100% no-repeat;
  -webkit-background-clip: text; background-clip: text; animation: brille 4.8s ease-in-out 1.2s infinite;
}
.accroche { position: absolute; left: 14%; right: 14%; bottom: 13%; margin: 0; text-align: center; font-size: 5.1cqw; line-height: 1.2; font-weight: 800; color: var(--creme); text-wrap: balance; text-shadow: 0 .5cqw 0 #1b0f36, 0 0 2cqw rgba(0, 0, 0, .6); }

/* panneaux de pierre */
.lien {
  position: relative; display: grid; grid-template-columns: var(--tuile) minmax(0, 1fr) auto; align-items: center; gap: 16px; --tuile: 68px; --coin: 46px;
  padding: 16px 22px 16px 18px; min-height: 100px; text-decoration: none; color: var(--creme);
  background:
    radial-gradient(circle at 18% 28%, rgba(255, 255, 255, .06) 0 2px, transparent 3px) 0 0 / 23px 19px,
    radial-gradient(circle at 70% 70%, rgba(0, 0, 0, .12) 0 2px, transparent 3px) 0 0 / 29px 23px,
    linear-gradient(180deg, var(--pierre-haut), var(--pierre-bas));
  border: 3px solid #1c1a2c; border-radius: 12px;
  box-shadow: 0 7px 0 #14122a, 0 16px 22px rgba(0, 0, 0, .45), inset 0 3px 0 rgba(255, 255, 255, .18), inset 0 -4px 0 rgba(0, 0, 0, .25), inset 0 0 0 6px rgba(20, 18, 42, .22);
  transition: transform .15s ease, box-shadow .15s ease, filter .15s ease; animation: monte .6s both;
}
.lien:nth-of-type(1) { animation-delay: .5s; } .lien:nth-of-type(2) { animation-delay: .65s; } .lien:nth-of-type(3) { animation-delay: .8s; } .lien:nth-of-type(4) { animation-delay: .95s; }
.coin { position: absolute; width: var(--coin); height: var(--coin); pointer-events: none; z-index: 1; }
.coin svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 1px rgba(0, 0, 0, .55)); }
.c1 { left: -7px; top: -7px; } .c2 { right: -7px; top: -7px; transform: scaleX(-1); } .c3 { left: -7px; bottom: -7px; transform: scaleY(-1); } .c4 { right: -7px; bottom: -7px; transform: scale(-1, -1); }
.gemme { animation: gemme 2.6s ease-in-out infinite; }
.lien:hover { transform: translateY(-4px) scale(1.012); filter: brightness(1.12); box-shadow: 0 11px 0 #14122a, 0 24px 30px rgba(0, 0, 0, .5), 0 0 28px rgba(244, 184, 58, .35), inset 0 3px 0 rgba(255, 255, 255, .18), inset 0 -4px 0 rgba(0, 0, 0, .25), inset 0 0 0 6px rgba(20, 18, 42, .22); }
.lien:active { transform: translateY(5px); box-shadow: 0 2px 0 #14122a, 0 6px 10px rgba(0, 0, 0, .4), inset 0 3px 0 rgba(255, 255, 255, .12), inset 0 0 0 6px rgba(20, 18, 42, .22); }
.lien:focus-visible { outline: 4px solid var(--or-clair); outline-offset: 5px; }
.tuile { width: var(--tuile); height: var(--tuile); border-radius: 14px; display: grid; place-items: center; background: linear-gradient(180deg, #262440, #17152b); border: 3px solid #0f0d20; box-shadow: inset 0 3px 8px rgba(0, 0, 0, .6), 0 2px 0 rgba(255, 255, 255, .12); color: #fff; }
.tuile svg { width: 56%; height: 56%; display: block; }
.nom { display: block; font-family: var(--display); font-size: 29px; line-height: 1.02; letter-spacing: .03em; text-transform: uppercase; color: var(--creme); -webkit-text-stroke: 5px var(--brun); paint-order: stroke fill; text-shadow: 0 3px 0 rgba(0, 0, 0, .5); }
.detail { display: block; margin-top: 3px; font-size: 16px; font-weight: 800; color: var(--or); text-shadow: 0 2px 0 rgba(20, 10, 0, .7); overflow-wrap: anywhere; }
.fleche { display: block; width: 18px; height: 28px; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .6)); transition: transform .15s ease; }
.lien:hover .fleche { transform: translateX(5px); }
.lien--principal { --tuile: 84px; --coin: 58px; min-height: 148px; padding: 22px 28px 22px 24px; border-radius: 14px; }
.lien--principal .nom { font-size: 30px; }
.lien--principal .detail { font-size: 17px; color: var(--creme); font-weight: 700; }
.lien--principal .tuile { box-shadow: inset 0 3px 8px rgba(0, 0, 0, .6), 0 0 26px rgba(150, 100, 255, .55); animation: lueur 2.8s ease-in-out infinite; }
.lien--principal .tuile svg { width: 66%; height: 66%; filter: drop-shadow(0 0 8px rgba(180, 140, 255, .9)); }
.lien--principal .fleche { animation: pousse 1.4s ease-in-out infinite; }

@keyframes respire { 50% { transform: scale(1.07); opacity: .85; } }
@keyframes flotte { 0%, 100% { transform: translate(0, 0); } 33% { transform: translate(10px, -22px); } 66% { transform: translate(-8px, -10px); } }
@keyframes monte { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@keyframes titre { from { opacity: 0; transform: scale(.7) translateY(-18px); } to { opacity: 1; transform: none; } }
@keyframes brille { 0%, 20% { background-position: 160% 0; } 60%, 100% { background-position: -60% 0; } }
@keyframes gemme { 50% { filter: brightness(1.5) saturate(1.2); } }
@keyframes lueur { 50% { box-shadow: inset 0 3px 8px rgba(0, 0, 0, .6), 0 0 40px rgba(170, 120, 255, .85); } }
@keyframes pousse { 50% { transform: translateX(7px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script>
(function () {
  // Lucioles dorées qui dérivent et scintillent (désactivées si l'appareil demande moins d'animations)
  var c = document.getElementById('lucioles'); if (!c || !c.getContext) return;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var g = c.getContext('2d'), w = 0, h = 0, dpr = Math.min(window.devicePixelRatio || 1, 2), P = [];
  function taille() { w = innerWidth; h = innerHeight; c.width = w * dpr; c.height = h * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); }
  taille(); addEventListener('resize', taille);
  var n = w < 600 ? 36 : 64;
  for (var i = 0; i < n; i++) P.push({ x: Math.random() * w, y: Math.random() * h, r: .8 + Math.random() * 2.2, vx: (Math.random() - .5) * 12, vy: -4 - Math.random() * 12, ph: Math.random() * 6.28, f: .8 + Math.random() * 1.8 });
  var dernier = performance.now();
  function boucle(t) {
    var dt = Math.min((t - dernier) / 1000, .05); dernier = t; g.clearRect(0, 0, w, h);
    for (var i = 0; i < P.length; i++) {
      var p = P[i]; p.ph += dt * p.f; p.x += (p.vx + Math.sin(p.ph) * 8) * dt; p.y += p.vy * dt;
      if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; } if (p.x < -10) p.x = w + 10; if (p.x > w + 10) p.x = -10;
      var a = .25 + .75 * (.5 + .5 * Math.sin(p.ph * 2));
      g.beginPath(); g.fillStyle = 'rgba(255,224,120,' + a.toFixed(3) + ')'; g.shadowColor = 'rgba(255,200,80,.95)'; g.shadowBlur = 10; g.arc(p.x, p.y, p.r, 0, 6.2832); g.fill();
    }
    requestAnimationFrame(boucle);
  }
  requestAnimationFrame(boucle);
})();
</script>
